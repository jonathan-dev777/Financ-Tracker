<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financ-Tracker</title>
</head>
<body>
    <header>Personal Financ Tracker</header>

    <section class="financial-overwiew">
        <div class="card">
            <h2>Balance</h2>
            <p id="balance">
                0 €
            </p>
        </div>
        <div class="card">
            <h2>Income</h2>
            <p id="income">
                0 €
            </p>
        </div>
        <div class="card">
            <h2>Expenses</h2>
            <p id="expenses">
                0 €
            </p>
        </div>
    </section>
    <section class="transactions">
        <div class="add-transaction">
            <h2>ADD TRANSACTIONS</h2>
            <label for="description">Description:</label>
            <input type="text" id="description" placeholder="Your Description">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Your Amount">

            <label for="type">Type</label>
            <select id="type">
                <option value:"income">Income</option>
                <option value:"expense">Expense</option>
            </select>
            <button id="add-transaction-button">Add Transaction</button>

        </div>
        <div id="transaction-history">
            
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
